name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          # This repo relies on very recent std APIs (std.array_list.Managed,
          # std.Io.Dir, ...) that only exist on Zig's nightly master branch --
          # no stable release supports them yet. "master" always resolves to
          # today's nightly; if a future nightly breaks the build, pin to a
          # known-good version string from https://ziglang.org/download/index.json
          # (verify with `zig build test` locally first).
          version: master

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build (wasm + web)
        working-directory: web
        run: bun run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
