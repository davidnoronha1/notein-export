<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notein Viewer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        position: relative;
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100%;
        background: #000000;
      }
      #viewer {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #canvas.panning {
        cursor: grabbing;
      }
      #drop-zone {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #141414;
        z-index: 10;
        transition: background 0.15s ease;
      }
      #drop-zone.drag-over {
        background: #22293d;
      }
      #drop-zone.hidden {
        display: none;
      }
      #drop-zone p {
        color: #ccc;
        font-size: 16px;
      }
      #drop-zone button {
        font-size: 15px;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
      }
      #drop-zone button:hover {
        background: #292929;
      }
      #drop-zone.loading button {
        opacity: 0.5;
        pointer-events: none;
      }
      #drop-zone.loading p {
        color: #8ab0ff;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 12px;
        color: #ddd;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 6px;
        z-index: 15;
        pointer-events: none;
      }
      #stats {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 11px;
        color: #9c9;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 6px;
        z-index: 5;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      #progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 20;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      #progress-bar.hidden {
        display: none;
      }
      #progress-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: #4f8cff;
        /* Animates `transform`, not `left` -- `left` needs main-thread layout
           every frame, which stalls for the whole duration of the synchronous,
           main-thread-blocking wasm.openFile() parse triggered right after
           this bar is shown (freezing the bar for that whole time). A pure
           transform animation can be handed to the compositor thread, which
           keeps ticking even while the main thread is blocked. */
        animation: progress-slide 1.1s ease-in-out infinite;
        will-change: transform;
      }
      @keyframes progress-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      #export-control {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.6);
        padding: 6px 10px;
        border-radius: 20px;
        z-index: 5;
      }
      #export-control.hidden {
        display: none;
      }
      #export-control button {
        font-size: 12px;
        padding: 5px 10px;
        border-radius: 14px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
        white-space: nowrap;
      }
      #export-control button:hover {
        background: #2a2a2a;
      }
      #export-control button.active {
        background: #4f8cff;
        border-color: #4f8cff;
      }
      #export-control select {
        font-size: 12px;
        padding: 4px 6px;
        border-radius: 10px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
      }
      #export-control .sep {
        width: 1px;
        height: 18px;
        background: #444;
      }
      #selection-overlay {
        position: absolute;
        inset: 0;
        z-index: 4;
        pointer-events: none;
      }
      #selection-overlay.active {
        pointer-events: auto;
        cursor: crosshair;
      }
      #selection-rect {
        position: absolute;
        border: 2px dashed #4f8cff;
        background: rgba(79, 140, 255, 0.12);
        display: none;
        pointer-events: none;
      }
      #export-panel {
        position: absolute;
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid #444;
        padding: 8px;
        border-radius: 10px;
        z-index: 6;
      }
      #export-panel.hidden {
        display: none;
      }
      #export-panel .row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #export-panel button,
      #export-panel select {
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
      }
      #export-panel button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      #export-panel button:hover {
        background: #2a2a2a;
      }
      .side-panel {
        position: absolute;
        top: 56px;
        right: 12px;
        width: 300px;
        max-height: calc(100% - 80px);
        display: flex;
        flex-direction: column;
        background: rgba(20, 20, 20, 0.92);
        border: 1px solid #444;
        border-radius: 10px;
        z-index: 6;
        overflow: hidden;
      }
      .side-panel.hidden {
        display: none;
      }
      .side-panel-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-bottom: 1px solid #333;
        flex: 0 0 auto;
      }
      .side-panel-tabs {
        display: flex;
        gap: 6px;
        flex: 1 1 auto;
      }
      .side-panel-title {
        flex: 1 1 auto;
        color: #ddd;
        font-size: 13px;
      }
      .side-panel button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
        white-space: nowrap;
      }
      .side-panel button svg {
        flex: 0 0 auto;
      }
      .side-panel button:hover {
        background: #2a2a2a;
      }
      .side-panel button.active {
        background: #4f8cff;
        border-color: #4f8cff;
      }
      .side-panel button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .side-panel-list {
        overflow-y: auto;
        padding: 10px;
      }
      .media-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 8px;
      }
      .media-thumb {
        position: relative;
        aspect-ratio: 1;
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        background: #111;
      }
      .media-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .media-dl {
        position: absolute;
        top: 4px;
        right: 4px;
        padding: 2px 6px !important;
        font-size: 11px !important;
        background: rgba(0, 0, 0, 0.6) !important;
      }
      .media-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .media-row {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 6px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
      }
      .media-row audio {
        width: 100%;
        height: 28px;
      }
      .media-row-label {
        color: #ddd;
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .media-row-actions {
        display: flex;
        gap: 6px;
      }
      .media-row a {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #8ab0ff;
        text-decoration: none;
      }
      .media-empty {
        color: #888;
        font-size: 12px;
        margin: 0;
      }
      #zoom-control {
        position: absolute;
        bottom: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 20px;
        z-index: 5;
      }
      #zoom-control.hidden {
        display: none;
      }
      #zoom-slider {
        width: 140px;
      }
      #zoom-control button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
        flex: 0 0 auto;
      }
      #zoom-control button:hover {
        background: #2a2a2a;
      }
      #zoom-label {
        color: #ddd;
        font-size: 15px;
        min-width: 3.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #minimap {
        position: relative;
        flex: 0 0 130px;
        width: 130px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #222;
        overflow-y: auto;
        padding: 10px 0;
        box-sizing: border-box;
      }
      #minimap.hidden {
        display: none;
      }
      #minimap-track {
        position: relative;
        margin: 0 auto;
        width: 96px;
      }
      .minimap-page {
        position: relative;
        width: 96px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .minimap-page canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid #333;
      }
      #minimap-indicator {
        position: absolute;
        left: -3px;
        width: calc(100% + 6px);
        border: 2px solid #4f8cff;
        background: rgba(79, 140, 255, 0.15);
        pointer-events: none;
        border-radius: 2px;
      }
      /* Infinite-canvas notes: one 2D thumbnail of the whole content instead
         of a vertical page stack, with a viewport rect free to move on both
         axes (see Minimap's `freeform` mode) -- #minimap-indicator's default
         full-bleed-width styling above only makes sense for a vertical strip
         of stacked pages, so the free-roaming indicator overrides it. */
      #minimap-track.free {
        width: 96px;
        cursor: crosshair;
      }
      .minimap-free-canvas {
        display: block;
        width: 96px;
        border: 1px solid #333;
      }
      #minimap-indicator.free {
        left: 0;
        width: 0;
      }
      #file-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewer">
        <canvas id="canvas"></canvas>
        <div id="status"></div>
        <div id="stats"></div>
        <div id="progress-bar" class="hidden"><div id="progress-bar-fill"></div></div>
        <div id="export-control" class="hidden">
          <select id="export-scale" aria-label="Export resolution">
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4" selected>4x</option>
          </select>
          <button id="select-tool" type="button">Select region…</button>
          <div class="sep"></div>
          <button id="export-page-png" type="button">Export page PNG</button>
          <button id="export-page-pdf" type="button">Export page PDF</button>
          <button id="export-page-svg" type="button">Export page SVG</button>
          <div class="sep"></div>
          <span id="media-tool-root"></span>
          <span id="links-tool-root"></span>
        </div>
        <div id="selection-overlay">
          <div id="selection-rect"></div>
        </div>
        <div id="export-panel" class="hidden">
          <div class="row">
            <button id="export-region-png" type="button">Export PNG</button>
            <button id="export-region-pdf" type="button">Export PDF</button>
            <button id="export-region-svg" type="button">Export SVG</button>
            <button id="export-region-cancel" type="button" aria-label="Cancel selection">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" />
                <path d="M6 6l12 12" />
              </svg>
            </button>
          </div>
        </div>
        <div id="media-panel-root"></div>
        <div id="links-panel-root"></div>
        <div id="zoom-control" class="hidden">
          <button id="zoom-out" type="button" aria-label="Zoom out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
            </svg>
          </button>
          <input id="zoom-slider" type="range" min="0" max="100" step="0.5" value="50" />
          <button id="zoom-in" type="button" aria-label="Zoom in">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14" />
              <path d="M5 12h14" />
            </svg>
          </button>
          <span id="zoom-label">100%</span>
        </div>
      </div>
      <div id="minimap" class="hidden"></div>
      <div id="drop-zone">
        <p id="drop-message">Drag &amp; drop a Notein <code>.in</code> file here</p>
        <button id="open-button" type="button">Or choose a file…</button>
        <input id="file-input" type="file" accept=".in" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
