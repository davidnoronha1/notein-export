<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notein Viewer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        position: relative;
        display: flex;
        flex-direction: row;
        width: 100%;
        height: 100%;
        background: #000000;
      }
      #viewer {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #canvas.panning {
        cursor: grabbing;
      }
      #drop-zone {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        background: #141414;
        z-index: 10;
        transition: background 0.15s ease;
      }
      #drop-zone.drag-over {
        background: #22293d;
      }
      #drop-zone.hidden {
        display: none;
      }
      #drop-zone p {
        color: #ccc;
        font-size: 16px;
      }
      #drop-zone button {
        font-size: 15px;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #1e1e1e;
        color: #eee;
        cursor: pointer;
      }
      #drop-zone button:hover {
        background: #292929;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        font-size: 12px;
        color: #ddd;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 6px;
        z-index: 5;
        pointer-events: none;
      }
      #stats {
        position: absolute;
        top: 12px;
        right: 12px;
        font-size: 11px;
        color: #9c9;
        background: rgba(0, 0, 0, 0.6);
        padding: 4px 8px;
        border-radius: 6px;
        z-index: 5;
        pointer-events: none;
        font-variant-numeric: tabular-nums;
        white-space: pre;
      }
      #progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        z-index: 6;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }
      #progress-bar.hidden {
        display: none;
      }
      #progress-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        background: #4f8cff;
        animation: progress-slide 1.1s ease-in-out infinite;
      }
      @keyframes progress-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      #zoom-control {
        position: absolute;
        bottom: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(0, 0, 0, 0.6);
        padding: 8px 12px;
        border-radius: 20px;
        z-index: 5;
      }
      #zoom-control.hidden {
        display: none;
      }
      #zoom-slider {
        width: 140px;
      }
      #zoom-control button {
        width: 22px;
        height: 22px;
        line-height: 1;
        padding: 0;
        border-radius: 50%;
        border: 1px solid #555;
        background: #1e1e1e;
        color: #eee;
        font-size: 15px;
        cursor: pointer;
        flex: 0 0 auto;
      }
      #zoom-control button:hover {
        background: #2a2a2a;
      }
      #zoom-label {
        color: #ddd;
        font-size: 12px;
        min-width: 3.5em;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #minimap {
        position: relative;
        flex: 0 0 130px;
        width: 130px;
        height: 100%;
        background: #0a0a0a;
        border-left: 1px solid #222;
        overflow-y: auto;
        padding: 10px 0;
        box-sizing: border-box;
      }
      #minimap.hidden {
        display: none;
      }
      #minimap-track {
        position: relative;
        margin: 0 auto;
        width: 96px;
      }
      .minimap-page {
        position: relative;
        width: 96px;
        margin-bottom: 4px;
        cursor: pointer;
      }
      .minimap-page canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: 1px solid #333;
      }
      #minimap-indicator {
        position: absolute;
        left: -3px;
        width: calc(100% + 6px);
        border: 2px solid #4f8cff;
        background: rgba(79, 140, 255, 0.15);
        pointer-events: none;
        border-radius: 2px;
      }
      #file-input {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewer">
        <canvas id="canvas"></canvas>
        <div id="status"></div>
        <div id="stats"></div>
        <div id="progress-bar" class="hidden"><div id="progress-bar-fill"></div></div>
        <div id="zoom-control" class="hidden">
          <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
          <input id="zoom-slider" type="range" min="0" max="100" step="0.5" value="50" />
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <span id="zoom-label">100%</span>
        </div>
      </div>
      <div id="minimap" class="hidden"></div>
      <div id="drop-zone">
        <p>Drag &amp; drop a Notein <code>.in</code> file here</p>
        <button id="open-button" type="button">Or choose a file…</button>
        <input id="file-input" type="file" accept=".in" />
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
